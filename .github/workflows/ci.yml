name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # macos-latest is arm64, and actions/setup-python publishes no
          # arm64 CPython 3.8 build (3.8 is EOL), so this leg fails at the
          # setup step before any test runs. 3.8 stays covered on ubuntu
          # and windows, which is enough to hold the requires-python floor.
          - os: macos-latest
            python-version: "3.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test — help output
        run: python csession.py --help

      - name: Smoke test — init
        run: |
          mkdir smoke-test && cd smoke-test && git init -q
          python ../csession.py init smoke
          python ../csession.py task add "Smoke test task"
          python ../csession.py task done T01
          python ../csession.py save -m "CI smoke test"
          python ../csession.py status
          python ../csession.py resume

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        # Lints the whole project, not just csession.py — the hook and the test
        # suite are shipped code too, and checking one file let real dead code
        # sit in .claude/hooks/auto_save.py unnoticed. Rules are pinned in
        # pyproject.toml so this result does not drift with new ruff releases.
        run: ruff check .
