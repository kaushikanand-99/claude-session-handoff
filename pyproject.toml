[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csession"
version = "1.0.0"
description = "Claude Code Session Manager — save and restore AI coding session context"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Kaushik Anand", email = "kaushik.anand.tech@gmail.com" }
]
keywords = ["claude", "ai", "session", "context", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

# No required dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
csession = "csession:main"

[project.urls]
Homepage   = "https://github.com/kaushikanand-99/claude-session-handoff"
Repository = "https://github.com/kaushikanand-99/claude-session-handoff"
Issues     = "https://github.com/kaushikanand-99/claude-session-handoff/issues"
Changelog  = "https://github.com/kaushikanand-99/claude-session-handoff/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["csession"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# Pinned explicitly. With no config, ruff lints against whatever its current
# defaults happen to be, so a new ruff release can turn CI red without a single
# line of this project changing. Selecting the set makes the result reproducible.
select = [
    "E4", "E7", "E9",  # pycodestyle: the subset ruff enables by default
    "F",               # pyflakes: real errors — undefined names, dead imports
    "B",               # bugbear: likely bugs
    "DTZ",             # timezone-naive datetimes
    "BLE",             # blind excepts
    "S",               # bandit security checks
    "PLW",             # pylint warnings
]
ignore = [
    # csession timestamps are deliberately local wall-clock time. They label a
    # developer's own session log ("saved at 14:30") and are read back by a
    # human on the same machine, so UTC would be actively less useful here.
    "DTZ005",
]

[tool.ruff.lint.per-file-ignores]
# Tests shell out to the CLI and assert on its behaviour; subprocess and
# assert usage is the point, not a smell.
"tests/*" = ["S101", "S603", "S607"]
